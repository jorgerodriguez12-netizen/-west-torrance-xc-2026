name: Update 2026 XC Results

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: xc-results-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - run: python ingest_finished_results.py

      - name: Commit updated results
        run: |
          git config user.name "XC Results Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/results.csv data/meets.csv data/parser_version.txt
          git diff --cached --quiet || git commit -m "Update 2026 XC results"
          git pull --rebase origin main
          git push
