name: Update 2026 XC Results

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - run: python ingest_finished_results.py

      - name: Commit updated results
        run: |
          git config user.name "XC Results Bot"
          git config user.email "actions@users.noreply.github.com"
          git add results.csv meets.csv
          git diff --cached --quiet || git commit -m "Update 2026 XC results"
          git push
